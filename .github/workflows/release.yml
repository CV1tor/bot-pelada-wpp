name: Release e publicação

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validar:
    name: Validar release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/pelada

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar pnpm
        uses: pnpm/action-setup@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar cliente Prisma
        run: pnpm prisma:generate

      - name: Validar formatação
        run: pnpm format:check

      - name: Executar lint
        run: pnpm lint

      - name: Executar testes
        run: pnpm test

      - name: Compilar aplicação
        run: pnpm build

      - name: Validar schema Prisma
        run: pnpm prisma validate

  publicar:
    name: Versionar e publicar
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - name: Baixar histórico completo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar pnpm
        uses: pnpm/action-setup@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar release e publicar imagem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release
